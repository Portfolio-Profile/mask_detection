<!DOCTYPE html>
<html>
<head>
  <title>Mask Detection (Browser-based)</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js"></script>
  <style>
    video, canvas {
      position: absolute;
      left: 0;
      top: 0;
    }
  </style>
</head>
<body>
  <video id="video" width="640" height="480" autoplay muted></video>
  <canvas id="overlay" width="640" height="480"></canvas>

  <script>
    const MODEL_URL = './model.json';

    let model;

    async function setup() {
      model = await tf.loadLayersModel(MODEL_URL);
      await faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/face-api.js/weights');
      startVideo();
    }

    function startVideo() {
      navigator.mediaDevices.getUserMedia({ video: {} })
        .then(stream => {
          const video = document.getElementById('video');
          video.srcObject = stream;
        });
    }

    video.addEventListener('play', () => {
      const canvas = document.getElementById('overlay');
      const displaySize = { width: video.width, height: video.height };
      faceapi.matchDimensions(canvas, displaySize);

      setInterval(async () => {
        const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions());
        const resizedDetections = faceapi.resizeResults(detections, displaySize);
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let det of resizedDetections) {
          const box = det.box;
          const faceCanvas = document.createElement('canvas');
          faceCanvas.width = 100;
          faceCanvas.height = 100;
          faceCanvas
            .getContext('2d')
            .drawImage(video, box.x, box.y, box.width, box.height, 0, 0, 100, 100);
          
          const tensor = tf.browser.fromPixels(faceCanvas).div(255.0).reshape([1, 100, 100, 3]);
          const prediction = await model.predict(tensor).data();
          const label = prediction[0] > prediction[1] ? "😷 Mask" : "🚫 No Mask";
          const color = prediction[0] > prediction[1] ? "green" : "red";

          ctx.strokeStyle = color;
          ctx.lineWidth = 3;
          ctx.strokeRect(box.x, box.y, box.width, box.height);
          ctx.font = "16px Arial";
          ctx.fillStyle = color;
          ctx.fillText(label, box.x, box.y - 10);
        }
      }, 500);
    });

    setup();
  </script>
</body>
</html>
